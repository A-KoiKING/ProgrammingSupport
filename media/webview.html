<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
    <style>
        body {
            font-family: var(--vscode-font-family);
            color: var(--vscode-foreground);
            padding: 15px;
        }

        .section {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--vscode-panel-border);
            padding-bottom: 10px;
        }

        .label {
            color: var(--vscode-descriptionForeground);
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value {
            font-weight: 600;
            font-size: 1.1em;
            word-break: break-all;
        }

        .type-tag {
            background-color: var(--vscode-textBlockQuote-background);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-top: 5px;
            color: var(--vscode-symbolIcon-variableForeground);
        }

        /* --- エラーヒントセクション --- */
        #error-hint-section {
            display: none;
            background-color: var(--vscode-inputValidation-errorBackground, #5a1d1d);
            border-left: 4px solid var(--vscode-inputValidation-errorBorder, #be1100);
            color: var(--vscode-foreground);
            padding: 10px 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .hint-title {
            font-weight: bold;
            color: var(--vscode-errorForeground, #f48771);
            margin-bottom: 4px;
            font-size: 0.95em;
        }

        .hint-body {
            font-size: 0.9em;
            line-height: 1.4;
        }

        /* --- 定義情報セクション --- */
        #definition-section {
            display: none;
        }

        .def-row {
            margin-bottom: 10px;
        }

        .def-example {
            display: block;
            background-color: var(--vscode-textBlockQuote-background);
            border-left: 3px solid var(--vscode-textBlockQuote-border);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: var(--vscode-editor-font-family, monospace);
            font-size: 0.95em;
            margin-top: 4px;
            word-break: break-all;
        }

        .def-warning {
            display: block;
            background-color: var(--vscode-inputValidation-warningBackground, #452a00);
            border-left: 3px solid var(--vscode-inputValidation-warningBorder, #f99);
            color: var(--vscode-inputValidation-warningForeground, #f99);
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <!-- エラーヒント表示枠 -->
    <div id="error-hint-section">
        <div class="hint-title">💡 エラーのヒント</div>
        <div id="error-hint-text" class="hint-body"></div>
    </div>

    <div class="section">
        <div class="label">変数名</div>
        <div id="var-name" class="value">-</div>
    </div>
    <div class="section">
        <div class="label">型</div>
        <div id="var-type" class="type-tag">-</div>
    </div>
    <div class="section">
        <div class="label">行</div>
        <div id="var-pos" class="value">-</div>
    </div>

    <!-- JSON定義情報セクション -->
    <div id="definition-section">
        <div class="section def-row">
            <div class="label">カテゴリ</div>
            <span id="def-category" class="category-badge">-</span>
        </div>
        <div class="section def-row">
            <div class="label">説明</div>
            <div id="def-description" class="value"></div>
        </div>
        <div class="section def-row">
            <div class="label">例</div>
            <code id="def-example" class="def-example"></code>
        </div>
        <div class="section def-row">
            <div class="label">備考</div>
            <div id="def-notes"></div>
        </div>
        <div class="def-row">
            <div class="label">注意点</div>
            <span id="def-warning" class="def-warning"></span>
        </div>
    </div>

    <script nonce="{{nonce}}">
        const vscode = acquireVsCodeApi();
        window.addEventListener('message', event => {
            const message = event.data;
            if (message.type === 'update') {
                document.getElementById('var-name').textContent = message.word;
                document.getElementById('var-type').textContent = message.typeInfo;
                document.getElementById('var-pos').textContent = `Line ${message.line}, Col ${message.character}`;

                // エラーヒントの表示切り替え
                const hintSection = document.getElementById('error-hint-section');
                const hintText = document.getElementById('error-hint-text');
                if (message.errorHint) {
                    hintText.textContent = message.errorHint;
                    hintSection.style.display = 'block';
                } else {
                    hintSection.style.display = 'none';
                }

                const defSection = document.getElementById('definition-section');
                if (message.definition) {
                    const d = message.definition;
                    document.getElementById('def-category').textContent    = d.category    ?? '—';
                    document.getElementById('def-description').textContent = d.description ?? '—';
                    document.getElementById('def-example').textContent     = d.example     ?? '—';
                    document.getElementById('def-notes').textContent       = d.notes       ?? '—';
                    document.getElementById('def-warning').textContent     = d.warning     ?? '—';
                    defSection.style.display = 'block';
                } else {
                    defSection.style.display = 'none';
                }
            }
        });
    </script>
</body>

</html>
